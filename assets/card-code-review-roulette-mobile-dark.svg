<svg xmlns="http://www.w3.org/2000/svg" width="400" height="527" viewBox="0 0 400 527" role="img" aria-labelledby="t d"><title id="t">Code Review Roulette — Web · Full-Stack</title><desc id="d">Choosing reviewers by hand is slow and uneven. Two wheels pair the whole team so everyone reviews exactly one teammate, and nobody reviews their own code. Role: Solo project, built with an AI-assisted workflow (Claude Code). Proof: Pairing planned before the first spin · saved rounds validated · 8 tests incl. 10,000 randomized rounds. Stack: Next.js 16, React 19, TypeScript, Tailwind, node:test, Vercel.</desc><style>@font-face{font-family:WKMono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKBody;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKMonoM;src:url(data:font/woff2;base64,) format('woff2');}</style><polygon points="19,1 399,1 399,508 381,526 1,526 1,19" fill="#171a1f" stroke="#3a404a" stroke-width="1.5"/><rect x="64" y="-4" width="46" height="10" fill="#22262d" stroke="#3a404a" stroke-width="1"/><circle cx="74" cy="1" r="2" fill="#8c95a0"/><circle cx="100" cy="1" r="2" fill="#8c95a0"/><rect x="290" y="-4" width="46" height="10" fill="#22262d" stroke="#3a404a" stroke-width="1"/><circle cx="300" cy="1" r="2" fill="#8c95a0"/><circle cx="326" cy="1" r="2" fill="#8c95a0"/><rect x="22" y="33" width="6" height="6" fill="#3fd7ea"/><text x="36.0" y="40.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#3fd7ea" text-anchor="start" letter-spacing="1.44">01 · WEB · FULL-STACK</text><rect x="22.0" y="53" width="238.6" height="26" fill="none" stroke="#d9a441" stroke-width="1.5"/><text x="141.3" y="70.5" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#d9a441" text-anchor="middle" letter-spacing="1.44">LIVE · 10,000-ROUND TESTS</text><text x="20.0" y="126.0" font-family="WKDisplay,'A