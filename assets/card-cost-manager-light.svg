<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Cost Manager API — Backend · Rest Api</title><desc id="d">Users log costs by category and need monthly summaries. A RESTful service handles users, costs, monthly reports and per-request audit logging. Role: Team of 2 — co-developed with Shafir Hafif. Proof: MVC layout · Mongoose models · past-month reports cached once computed · pino request logging. Stack: Node.js, Express 5, MongoDB, Mongoose, pino, MVC.</desc><style>@font-face{font-family:WKMono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKBody;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKMonoM;src:url(data:font/woff2;base64,) format('woff2');}</style><polygon points="19,1 719,1 719,331 701,349 1,349 1,19" fill="#fbfaf7" stroke="#a7aeb5" stroke-width="1.5"/><rect x="64" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="74" cy="1" r="2" fill="#59616b"/><circle cx="100" cy="1" r="2" fill="#59616b"/><rect x="610" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="620" cy="1" r="2" fill="#59616b"/><circle cx="646" cy="1" r="2" fill="#59616b"/><rect x="30" y="33" width="6" height="6" fill="#00808f"/><text x="44.0" y="40.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#00808f" text-anchor="start" letter-spacing="1.44">03 · BACKEND · REST API</text><rect x="503.3" y="23" width="186.7" height="26" fill="none" stroke="#c08a1e" stroke-width="1.5"/><text x="596.6" y="40.5" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#855c00" text-anchor="middle" letter-spacing="1.44">EXPRESS 5 · MONGODB</text><text x="28.0" y="94.0" font-family="WKDisplay,'Arial Narrow',Impact,sans-serif" font-size="46" fill="#121417"