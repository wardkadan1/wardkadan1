<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">CPU 16-8-16 — Digital Hardware · Vhdl</title><desc id="d">A microcoded 16-bit CPU reworked for an 8-bit program memory, so every 16-bit word moves as a low byte and then a high byte. Design: 30-state FSM control unit generated from algorithmic state machines; PC, MAC, IR, BR and ALU datapath. Proof: Same test program gives matching output in HLS and RTL simulation (ModelSim). Stack: VHDL, ModelSim, Synthagate, ASMCreator, FSM, RTL.</desc><style>@font-face{font-family:WKMono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKBody;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKMonoM;src:url(data:font/woff2;base64,) format('woff2');}</style><polygon points="19,1 719,1 719,331 701,349 1,349 1,19" fill="#fbfaf7" stroke="#a7aeb5" stroke-width="1.5"/><rect x="64" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="74" cy="1" r="2" fill="#59616b"/><circle cx="100" cy="1" r="2" fill="#59616b"/><rect x="610" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="620" cy="1" r="2" fill="#59616b"/><circle cx="646" cy="1" r="2" fill="#59616b"/><rect x="30" y="33" width="6" height="6" fill="#855c00"/><text x="44.0" y="40.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#855c00" text-anchor="start" letter-spacing="1.44">04 · DIGITAL HARDWARE · VHDL</text><rect x="589.7" y="23" width="100.3" height="26" fill="none" stroke="#c08a1e" stroke-width="1.5"/><text x="639.8" y="40.5" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#855c00" text-anchor="middle" letter-spacing="1.44">GRADE 100</text><text x="28.0" y="94.0" font-family="WKDisplay,'Arial Narrow',Impact,sans-serif" font-size="46" fill="#121417" text-anchor="start" letter-spacing="0.46">CPU 16-8-16</text><text x="30.0" y="128.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#424a53" text-anchor="start">A microcoded 16-bit CPU reworked for an 8-bit program memory, so every 16-bit</text><text x="30.0" y="153.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#424a53" text-anchor="start">word moves as a low byte and then a high byte.</text><line x1="30" y1="175" x2="690" y2="175" stroke="#d4d6d6" stroke-width="1"/><text x="30.0" y="201.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#59616b" text-anchor="start" letter-spacing="1.32">DESIGN</text><text x="122.0" y="201.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">30-state FSM control unit generated from algorithmic state machines; PC, MAC, IR,</text><text x="122.0" y="222.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">BR and ALU datapath</text><text x="30.0" y="251.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#59616b" text-anchor="start" letter-spacing="1.32">PROOF</text><text x="122.0" y="251.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">Same test program gives matching output in HLS and RTL simulation (ModelSim)</text><rect x="30.0" y="286" width="51.0" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="40.0" y="303.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start" letter-spacing="0.72">VHDL</text><rect x="88.0" y="286" width="82.6" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="98.0" y="303.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start"