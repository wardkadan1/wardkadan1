<svg xmlns="http://www.w3.org/2000/svg" width="400" height="524" viewBox="0 0 400 524" role="img" aria-labelledby="t d"><title id="t">CPU 16-8-16 — Digital Hardware · Vhdl</title><desc id="d">A microcoded 16-bit CPU reworked for an 8-bit program memory, so every 16-bit word moves as a low byte and then a high byte. Design: 30-state FSM control unit generated from algorithmic state machines; PC, MAC, IR, BR and ALU datapath. Proof: Same test program gives matching output in HLS and RTL simulation (ModelSim). Stack: VHDL, ModelSim, Synthagate, ASMCreator, FSM, RTL.</desc><style>@font-face{font-family:WKMono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKBody;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKMonoM;src:url(data:font/woff2;base64,) format('woff2');}</style><polygon points="19,1 399,1 399,505 381,523 1,523 1,19" fill="#fbfaf7" stroke="#a7aeb5" stroke-width="1.5"/><rect x="64" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="74" cy="1" r="2" fill="#59616b"/><circle cx="100" cy="1" r="2" fill="#59616b"/><rect x="290" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="300" cy="1" r="2" fill="#59616b"/><circle cx="326" cy="1" r="2" fill="#59616b"/><rect x="22" y="33" width="6" height="6" fill="#855c00"/><text x="36.0" y="40.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#855c00" text-anchor="start" letter-spacing="1.44">04 · DIGITAL HARDWARE · VHDL</text><rect x="22.0" y="53" width="100.3" height="26" fill="none" stroke="#c08a1e" stroke-width="1.5"/><text x="72.2" y="70.5" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#855c00" text-anchor="middle" letter-spacing="1.44">GRADE 100</text><text x="20.0" y="126.0" font-family="WKDisplay,'Arial Narrow',Impact,sans-serif" font-size="34" fill="#121417" text-anchor="start" letter-spacing="0.34">CPU 16-8-16</text><text x="22.0" y="156.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#424a53" text-anchor="start">A microcoded 16-bit CPU reworked for an 8-bit</text><text x="22.0" y="180.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#424a53" text-anchor="start">program memory, so every 16-bit word moves</text><text x="22.0" y="204.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#424a53" text-anchor="start">as a low byte and then a high byte.</text><line x1="22" y1="226" x2="378" y2="226" stroke="#d4d6d6" stroke-width="1"/><text x="22.0" y="252.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#59616b" text-anchor="start" letter-spacing="1.32">DESIGN</text><text x="22.0" y="274.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">30-state FSM control unit generated from</text><text x="22.0" y="295.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">algorithmic state machines; PC, MAC, IR, BR and</text><text x="22.0" y="316.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">ALU datapath</text><text x="22.0" y="347.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#59616b" text-anchor="start" letter-spacing="1.32">PROOF</text><text x="22.0" y="369.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">Same test program gives matching output in HLS</text><text x="22.0" y="390.0" font-family="WKBody,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#121417" text-anchor="start">and RTL simulation (ModelSim)</text><rect x="22.0" y="427" width="51.0" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="32.0" y="444.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start" letter-spacing="0.72">VHDL</text><rect x="80.0" y="427" width="82.6" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="90.0" y="444.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start" letter-spacing="0.72">ModelSim</text><rect x="169.6" y="427" width="98.5" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="179.6" y="444.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start" letter-spacing="0.72">Synthagate</text><rect x="275.1" y="427" width="98.5" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="285.1" y="444.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start" letter-spacing="0.72">ASMCreator</text><rect x="22.0" y="460" width="43.0" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="32.0" y="477.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start" letter-spacing="0.72">FSM</text><rect x="72.0" y="460" width="43.0" height="26" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><text x="82.0" y="477.5" font-family="WKMonoM,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#121417" text-anchor="start" letter-spacing="0.72">RTL</text><path d="M22.0 516v-9M34.0 516v-5M46.0 516v-5M58.0 516v-5M70.0 516v-5M82.0 516v-9M94.0 516v-5M106.0 516v-5M118.0 516v-5M130.0 516v-5M142.0 516v-9M154.0 516v-5M166.0 516v-5M178.0 516v-5M190.0 516v-5M202.0 516v-9M214.0 516v-5M226.0 516v-5M238.0 516v-5M250.0 516v-5M262.0 516v-9M274.0 516v-5M286.0 516v-5M298.0 516v-5M310.0 516v-5M322.0 516v-9" stroke="#c08a1e" stroke-width="1.5" opacity="0.8"/><text x="378.0" y="513.0" font-family="WKMono,ui-monospace,Menlo,Consolas,m