<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Harmony Headlines — Web · Full-Stack · Ai Api</title><desc id="d">Regional news headlines can be emotionally charged. Every headline gets a 0–10 tone score from Gemini, and admins can rewrite a story calmer or sharper. System: React client and a separate Express API, in two repositories. Proof: MediaStack + Gemini integration · Clerk auth with an admin role · per-article tone rewrite. Stack: React, Vite, Express, Gemini API, Clerk, REST.</desc><style>@font-face{font-family:WKMono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKBody;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKMonoM;src:url(data:font/woff2;base64,) format('woff2');}</style><polygon points="19,1 719,1 719,331 701,349 1,349 1,19" fill="#171a1f" stroke="#3a404a" stroke-width="1.5"/><rect x="64" y="-4" width="46" height="10" fill="#22262d" stroke="#3a404a" stroke-width="1"/><circle cx="74" cy="1" r="2" fill="#8c95a0"/><circle cx="100" cy="1" r="2" fill="#8c95a0"/><rect x="610" y="-4" width="46" height="10" fill="#22262d" stroke="#3a404a" stroke-width="1"/><circle cx="620" cy="1" r="2" fill="#8c95a0"/><circle cx="646" cy="1" r="2" fill="#8c95a0"/><rect x="30" y="33" width="6" height="6" fill="#3fd7ea"/><text x="44.0" y="40.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#3fd7ea" text-anchor="start" letter-spacing="1.44">02 · WEB · FULL-STACK · AI API</text><rect x="537.8" y="23" width="152.2" height="26" fill="none" stroke="#d9a441" stroke-width="1.5"/><text x="613.9" y="40.5" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#d9a441" text-anchor="middle" letter-spacing="1.44">REACT + EXPRESS</text><text x="28.0" y="94.0" font-family="WKDisplay,'Arial Narrow',Impact,sans-s