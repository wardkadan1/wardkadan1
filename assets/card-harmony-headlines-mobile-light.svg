<svg xmlns="http://www.w3.org/2000/svg" width="400" height="527" viewBox="0 0 400 527" role="img" aria-labelledby="t d"><title id="t">Harmony Headlines — Web · Full-Stack · Ai Api</title><desc id="d">Regional news headlines can be emotionally charged. Every headline gets a 0–10 tone score from Gemini, and admins can rewrite a story calmer or sharper. System: React client and a separate Express API, in two repositories. Proof: MediaStack + Gemini integration · Clerk auth with an admin role · per-article tone rewrite. Stack: React, Vite, Express, Gemini API, Clerk, REST.</desc><style>@font-face{font-family:WKMono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKBody;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKMonoM;src:url(data:font/woff2;base64,) format('woff2');}</style><polygon points="19,1 399,1 399,508 381,526 1,526 1,19" fill="#fbfaf7" stroke="#a7aeb5" stroke-width="1.5"/><rect x="64" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="74" cy="1" r="2" fill="#59616b"/><circle cx="100" cy="1" r="2" fill="#59616b"/><rect x="290" y="-4" width="46" height="10" fill="#e3e5e7" stroke="#a7aeb5" stroke-width="1"/><circle cx="300" cy="1" r="2" fill="#59616b"/><circle cx="326" cy="1" r="2" fill="#59616b"/><rect x="22" y="33" width="6" height="6" fill="#00808f"/><text x="36.0" y="40.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#00808f" text-anchor="start" letter-spacing="1.44">02 · WEB · FULL-STACK · AI API</text><rect x="22.0" y="53" width="152.2" height="26" fill="none" stroke="#c08a1e" stroke-width="1.5"/><text x="98.1" y="70.5" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#855c00" text-anchor="middle" letter-spacing="1.44">REACT + EXPRESS</text><text x="20.0" y="126.0" font-family="WKDisplay,'Arial Narrow',Impact,sans-se