<svg xmlns="http://www.w3.org/2000/svg" width="720" height="329" viewBox="0 0 720 329" role="img" aria-labelledby="t d"><title id="t">Parking Gate System — Embedded · Real-Time</title><desc id="d">An automatic parking gate on an Arduino UNO: two ultrasonic sensors, a servo gate, a status LCD and an interrupt-driven emergency mode. Role: Solo · register-level AVR firmware (DDRx / PORTx). Proof: INT0 ISR only sets a flag, debounced in the main loop · Timer1 servo · LCD over I2C. Stack: C, AVR, Interrupts, Timer1, I2C, Arduino UNO.</desc><style>@font-face{font-family:WKMono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKBody;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:WKMonoM;src:url(data:font/woff2;base64,) format('woff2');}</style><polygon points="19,1 719,1 719,310 701,328 1,328 1,19" fill="#171a1f" stroke="#3a404a" stroke-width="1.5"/><rect x="64" y="-4" width="46" height="10" fill="#22262d" stroke="#3a404a" stroke-width="1"/><circle cx="74" cy="1" r="2" fill="#8c95a0"/><circle cx="100" cy="1" r="2" fill="#8c95a0"/><rect x="610" y="-4" width="46" height="10" fill="#22262d" stroke="#3a404a" stroke-width="1"/><circle cx="620" cy="1" r="2" fill="#8c95a0"/><circle cx="646" cy="1" r="2" fill="#8c95a0"/><rect x="30" y="33" width="6" height="6" fill="#d9a441"/><text x="44.0" y="40.0" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#d9a441" text-anchor="start" letter-spacing="1.44">05 · EMBEDDED · REAL-TIME</text><rect x="598.3" y="23" width="91.7" height="26" fill="none" stroke="#d9a441" stroke-width="1.5"/><text x="644.2" y="40.5" font-family="WKMono,ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#d9a441" text-anchor="middle" letter-spacing="1.44">GRADE 95</text><text x="28.0" y="94.0" font-family="WKDisplay,'Arial Narrow',Impact,sans-serif" font-size="46" fill="#eceef1" text-anchor="start